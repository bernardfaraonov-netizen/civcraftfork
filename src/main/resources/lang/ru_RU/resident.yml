# Модуль жителей: /res, /money, /pay, /accept, /deny, телепорты, общие диалоги.
prompt:
  'yes': '<green>Да'
  'no': '<red>Нет'
  ok: '<green>Готово'

error:
  invalid-number: '<red>Введите число от <white><min></white> до <white><max></white>.'

names:
  length: '<red>Название должно быть длиной от <white><min></white> до <white><max></white> символов.'
  latin: '<red>Название может содержать только латинские буквы, цифры и «_».'
  tag: '<red>Тег — от 1 до <white><max></white> латинских букв.'
  group: '<red>Имя группы — от 2 до 20 латинских букв, цифр или «_».'

request:
  accept-button: '<green><b>[Принять]</b>'
  accept-hover: '<gray>Нажмите, чтобы принять (/accept)'
  deny-button: '<red><b>[Отклонить]</b>'
  deny-hover: '<gray>Нажмите, чтобы отклонить (/deny)'
  expires: '<dark_gray>(действует <seconds> с)'
  none: '<red>У вас нет ожидающих запросов.'
  denied: '<yellow>Запрос отклонён.'
  denied-by: '<yellow><white><name></white> отклонил ваш запрос.'
  expired: '<gray>Ваш запрос истёк без ответа.'

teleport:
  countdown: '<gold>Телепорт через <white><seconds></white> с. Не двигайтесь.'
  cancelled: '<red>Телепорт отменён: вы сдвинулись или получили урон.'

resident:
  help:
    - '<gold><b>Команды жителя</b> <gray>(/resident, /res)'
    - '<yellow>/res info</yellow> <gray>— информация о себе; <yellow>/res show <ник></yellow> — об игроке'
    - '<yellow>/res book</yellow> <gray>— книга-справочник; <yellow>/res recipes</yellow> — рецепты'
    - '<yellow>/res exchange <iron|gold|diamond|emerald> <кол-во|all></yellow> <gray>— обмен слитков по 30 %'
    - '<yellow>/res paydebt</yellow> <gray>— погасить личный долг'
    - '<yellow>/res pvptimer</yellow> <gray>— снять защиту новичка навсегда'
    - '<yellow>/res resetspawn</yellow> <gray>— возрождаться у ратуши своего города'
    - '<yellow>/res friends [add|remove] <ник|civ <цив>|town <город>></yellow> <gray>— друзья'
    - '<yellow>/res outlawed</yellow> <gray>— где вы в розыске'
    - '<yellow>/res set <настройка></yellow>, <yellow>/res toggle chat <civ|town|camp|ally></yellow>, <yellow>/res settings</yellow> <gray>— настройки'
    - '<yellow>/money</yellow>, <yellow>/pay <ник> <сумма></yellow>, <yellow>/accept</yellow>, <yellow>/deny</yellow>'
  none: '<gray>нет'
  cooldown: '<red>Подождите ещё <white><time></white>.'
  money: '<gold>Ваш баланс: <white><amount></white> монет.'
  money-debt: '<red>Личный долг: <white><amount></white> монет (/res paydebt).'
  pay:
    self: '<red>Нельзя перевести деньги самому себе.'
    sent: '<green>Вы перевели <white><amount></white> монет игроку <white><name></white>.'
    received: '<green>Игрок <white><name></white> перевёл вам <white><amount></white> монет.'
  info:
    header: '<gold>━━━ <white><name></white> ━━━'
    registered: '<gray>Зарегистрирован: <white><date></white>'
    online: '<gray>Статус: <green>в сети'
    last-seen: '<gray>Последний вход: <white><date></white>'
    town: '<gray>Город: <white><town></white>, цивилизация: <white><civ></white>'
    camp: '<gray>Лагерь: <white><camp></white>'
    balance: '<gray>Баланс: <gold><amount></gold> монет'
    debt: '<gray>Долг: <red><amount></red> монет'
    pvp: '<gray>Защита новичка: ещё <white><time></white>'
    friends: '<gray>Друзей: <white><count></white>'
  book:
    title: 'Справочник CivCraft'
    author: 'CivCraft'
    given: '<green>Книга-справочник выдана.'
    pages:
      - '<gold><b>CivCraft</b></gold>'
      - '<black>Постройте <b>лагерь</b> дверью лагеря, соберите жетоны лидерства и создайте <b>флаг основания</b> провинции.'
      - '<black>Основание провинции требует 25 000 монет на счёте.'
      - '<dark_gray><click:run_command:''/res recipes''><u>» Рецепты предметов</u></click>'
      - '---'
      - '<gold><b>Лагерь</b></gold>'
      - '<black>Печи у костра сжигают 4 угля в час. Без угля лагерь разрушается.'
      - '<black>Рейд возможен 2 часа перед временем основания, не раньше 22 ч после постройки.'
      - '<black>/camp upgrade — Сад, Дробилка, Большой дом.'
      - '---'
      - '<gold><b>Город</b></gold>'
      - '<black>/t claim — приват чанка в культуре города.'
      - '<black>/t upgrade — уровни города.'
      - '<black>/t info — производство, счастье, содержание.'
      - '<black>/t teleport — к ратуше (5 000).'
      - '---'
      - '<gold><b>Цивилизация</b></gold>'
      - '<black>/civ gov — государственный строй.'
      - '<black>/civ dip — дипломатия.'
      - '<black>/civ set taxes|science — налоги и наука.'
      - '<black>Налоги собираются в 20:00 МСК.'
  recipes-unavailable: '<red>Книга рецептов недоступна.'
  exchange:
    unknown: '<red>Можно обменять: iron, gold, diamond, emerald.'
    not-enough: '<red>У вас нет <white><count></white> подходящих предметов (переименованные и особые предметы не принимаются).'
    done: '<green>Обменено <white><count></white> × <white><item></white> на <gold><amount></gold> монет.'
  debt:
    none: '<green>У вас нет долга.'
    paid: '<green>Погашено <white><amount></white> монет долга. Осталось: <white><left></white>.'
  pvp:
    none: '<red>У вас нет защиты новичка.'
    confirm-title: '<red>Снять защиту новичка?'
    confirm-body:
      - 'Вы сможете атаковать игроков и будете уязвимы для них.'
      - 'Вернуть защиту будет невозможно.'
    removed: '<yellow>Защита новичка снята.'
  spawn-reset: '<green>Точка возрождения сброшена: вы будете появляться у ратуши своего города.'
  friends:
    list: '<gold>Друзья: <white><list></white>'
    town-entry: 'город <name>'
    civ-entry: 'цивилизация <name>'
    self: '<red>Нельзя добавить себя в друзья.'
    limit: '<red>Не больше <white><max></white> друзей.'
    already: '<red><white><name></white> уже в друзьях.'
    not-friend: '<red><white><name></white> нет в друзьях.'
    added: '<green><white><name></white> добавлен в друзья.'
    removed: '<yellow><white><name></white> удалён из друзей.'
  outlawed:
    none: '<green>Вы нигде не в розыске.'
    list: '<red>Вы в розыске в городах: <white><list></white>'
  settings:
    title: '<gold>Настройки'
    unknown: '<red>Неизвестная настройка.'
    'on': '<green>Включено: <white><setting></white>'
    'off': '<yellow>Выключено: <white><setting></white>'
    item-on: '<green><setting>: вкл'
    item-off: '<gray><setting>: выкл'
    name:
      tpconf: 'Телепорт без подтверждения'
      messages: 'Скрыть отчёты зданий'
      hide-scout: 'Скрыть сообщения разведки'
      info: 'Информация при входе в культуру'
      combatinfo: 'Боевая информация'
      itemdrops: 'Сообщения о выпадении предметов'
      map: 'Карта'
      kills: 'Сообщения об убийствах'
      fire: 'Сообщения об огне'
      preview: 'Предпросмотр построек'
      tiles: 'Сообщения улучшений'
      timef: '24-часовой формат'
      trail: 'След'
      mob: 'Сообщения о мобах'
      hide-chat-civ: 'Скрыть чат цивилизации'
      hide-chat-town: 'Скрыть чат города'
      hide-chat-camp: 'Скрыть чат лагеря'
      hide-chat-ally: 'Скрыть чат альянса'
