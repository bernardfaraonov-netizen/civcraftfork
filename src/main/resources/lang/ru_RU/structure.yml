# Постройки: /build, стройка, защита, контрольные блоки (docs/spec/02_buildings.md, 01_core.md §5.5, §6.2).
structure:
  command:
    description: 'Постройки города'
  help:
    - '<gold>━━ Постройки (/build, /b) ━━'
    - '<yellow>/b</yellow> <gray>— меню построек</gray>'
    - '<yellow>/b <название> [высота|+N|-N] [стиль]</yellow> <gray>— построить (встаньте в чанк лицом туда, где будет здание)</gray>'
    - '<yellow>/b yes</yellow> <gray>/</gray> <yellow>/b no</yellow> <gray>— подтвердить / отменить постановку</gray>'
    - '<yellow>/b progress [город]</yellow> <gray>— прогресс стройки</gray>'
    - '<yellow>/b cancel [wonder]</yellow> <gray>— отменить стройку здания (или чуда)</gray>'
    - '<yellow>/b nearest</yellow> <gray>— ближайшая постройка</gray>'
    - '<yellow>/b demolish</yellow>, <yellow>/b demolishnearest</yellow> <gray>— снос</gray>'
    - '<yellow>/b repairnearest</yellow> <gray>— ремонт разрушенной постройки</gray>'
    - '<yellow>/b refreshnearest</yellow>, <yellow>/b validatenearest</yellow> <gray>— восстановить / проверить блоки</gray>'
    - '<yellow>/b bonuses</yellow> <gray>— модификаторы стоимости</gray>'
    - '<yellow>/b info <название></yellow> <gray>— описание постройки</gray>'
    - '<yellow>/b theme [стиль]</yellow> <gray>— стиль построек города</gray>'

  # --- стройка ---------------------------------------------------------------------------------------------------------
