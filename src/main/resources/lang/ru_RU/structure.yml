  demolished: '<yellow>Постройка <white><name></white> снесена.'
  destroyed: '<red>Постройка <white><name></white> города <white><town></white> разрушена! <gray>(<coords>)</gray>'
  destroyed-building: '<red>Стройка <white><name></white> разрушена, вложения потеряны.'
