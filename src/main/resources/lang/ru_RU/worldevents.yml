worldevents:
  command-description: 'Текущее мировое событие и событие вашего города'
  started: '<gold><bold>Мировое событие:</bold> <white><name></white><gold>! Продлится <white><left></white>.'
  ended: '<gray>Мировое событие «<white><name></white>» закончилось.'
  current: '<gold>Мировое событие: <white><name></white> <gray>(осталось <left>)'
  none: '<gray>Мирового события сейчас нет. Следующее — через <white><next></white> (каждый вторник в 12:00).'
  admin:
    line: '<gray> - <white><id></white>: <name>'
    unknown: '<red>Неизвестное событие <white><id></white>.'
    none: '<red>Сейчас нет мирового события.'
  event:
    great_depression:
      name: 'Великая депрессия'
      description: '<gray>Мировой кризис: продажа в банках −10%, доход коттеджей −10%, доход рынков −10%, доход от торговли −10%, налог +5%.'
    fat_rats:
      name: 'Жирные крысы'
      description: '<gray>Крысы в Подземелье разжирели: здоровье +25%, урон +4, шанс выпадения меркурия +50%.'
    cultural_bloom:
      name: 'Культурный расцвет'
      description: '<gray>Эпоха искусств: культура в городах +20%, молоточки −10%.'
    science_bloom:
      name: 'Научный расцвет'
      description: '<gray>Время открытий: колбы +15%, стоимость технологий в монетах +15%.'
    perestroika:
      name: 'Перестройка'
      description: '<gray>Всеобщая стройка: молоточки +15%, стоимость построек и чудес в монетах +15%.'
    changes:
      name: 'Перемены'
      description: '<gray>Мир жаждет перемен: смена государственного строя вдвое быстрее.'
    pacifism:
      name: 'Пацифизм'
      description: '<gray>Мир устал от войн: инициаторам войн +1 несчастье в каждом городе, мирным цивилизациям −1 несчастье.'
    world_wars:
      name: 'Мировые войны'
      description: '<gray>Мир готовится к войне: налог за войну −0.5, военные постройки дешевле на 25% в монетах и молоточках, военные технологии −5% в монетах.'
    religious_fast:
      name: 'Религиозный пост'
      description: '<gray>Время поста: религия +25%, культура −10%.'
    circus:
      name: 'Цирк'
      description: '<gray>Цирк приехал! Счастье +3, наука −5%, молоточки −5%.'
    diligence_shine:
      name: 'Блеск трудолюбия'
      description: '<gray>Трудолюбие в почёте: улучшения −15%, юниты в бараках −10%, изучения −5%, счастье −3, религия −25%.'
