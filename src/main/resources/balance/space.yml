# Космические миссии (docs/spec/03_wonders_science.md §9, меркурий по [CL 1.10.6]).
# Нужен построенный Космический шаттл в столице (ключ чуда из science.yml → wonders).
# Компоненты кладутся в сундуки (любые контейнеры) внутри шаттла, запуск — /civ space launch
# или кнопка в /civ space. Миссии идут строго по порядку. Пока миссия идёт, молоточки родных
# незахваченных городов и вся наука цивилизации копятся в миссии (раз в минуту, 1/60 часовой ставки);
# исследования в это время не получают пробирок [допущение]. Требования уменьшает стат
# space_requirements (талант 5.2: −15 %). Если шаттл сломан, миссия стоит на паузе.

shuttle-wonder: space_shuttle
# При захвате цивилизации теряется столько завершённых миссий, прогресс текущей сбрасывается.
missions-lost-on-capture: 1

missions:
  1:
    name: Запуск орбитального спутника
    rocket: V-2
    hammers: 75000
    beakers: 75000
    components: {space_satellite: 1, space_fuel_tanks: 1, space_engines: 1}
    rewards: {mercury_t1: 16}
  2:
    name: Полёт на Луну
    rocket: Сатурн-5
    hammers: 150000
    beakers: 150000
    components: {space_fuel_tanks: 1, space_engines: 1, space_lander: 1, space_orbital_station: 1}
    rewards: {mercury_t1: 32}
  3:
    name: Полёт на Марс
    rocket: Polaris A-1
    hammers: 225000
    beakers: 225000
    components: {space_fuel_tanks: 1, space_engines: 1, space_lander: 1, space_orbital_station: 1, space_habitat_module: 1}
    rewards: {mercury_t2: 16}
  4:
    name: Запуск спутника к Солнцу
    rocket: Р-7
    hammers: 300000
    beakers: 300000
    components: {space_satellite: 1, space_fuel_tanks: 2, space_engines: 1, space_solar_reflector: 1, space_instruments: 1}
    rewards: {mercury_t2: 24, mercury_t1: 8}
  5:
    name: Полёт к границам Солнечной системы
    rocket: MX Peacekeeper
    hammers: 375000
    beakers: 375000
    components: {space_satellite: 1, space_fuel_tanks: 2, space_engines: 1, space_instruments: 2, space_solar_sail: 1}
    rewards: {mercury_t2: 32}
  6:
    name: Warp-прыжок к звезде Betelgeuse
    rocket: Minuteman LGM-3G
    hammers: 750000
    beakers: 750000
    components: {space_orbital_station: 1, space_habitat_module: 1, space_solar_reflector: 1, space_instruments: 1, space_provisions: 1, space_warp_core: 1, space_warp_drive: 1, space_gondolas: 1}
    rewards: {mercury_t3: 10}
  7:
    name: Warp-прыжок к планете Trestellar
    rocket: Trident II D5
    hammers: 1125000
    beakers: 1125000
    components: {space_lander: 1, space_orbital_station: 1, space_habitat_module: 2, space_instruments: 1, space_provisions: 1, space_warp_core: 1, space_warp_drive: 1, space_gondolas: 1}
    rewards: {mercury_t3: 18, mercury_t2: 4}

# Предметы-компоненты и награды. Если модуль предметов регистрирует эти id, используется он.
items:
  space_satellite: {name: Спутник, material: DAYLIGHT_DETECTOR}
  space_fuel_tanks: {name: Топливные баки, material: CAULDRON}
  space_engines: {name: Двигатели, material: BLAST_FURNACE}
  space_lander: {name: Посадочный модуль, material: MINECART}
  space_orbital_station: {name: Орбитальная станция, material: BEACON}
  space_habitat_module: {name: Жилой модуль, material: BARREL}
  space_solar_reflector: {name: Солнечный отражатель, material: TINTED_GLASS}
  space_instruments: {name: Аппаратура, material: COMPARATOR}
  space_solar_sail: {name: Солнечный парус, material: WHITE_BANNER}
  space_provisions: {name: Провизия, material: BUNDLE}
  space_warp_core: {name: Warp-ядро, material: END_CRYSTAL}
  space_warp_drive: {name: Warp-двигатель, material: RESPAWN_ANCHOR}
  space_gondolas: {name: Гондолы, material: CHEST_MINECART}
  mercury_t1: {name: T1 Меркурий, material: GHAST_TEAR}
  mercury_t2: {name: T2 Меркурий, material: PRISMARINE_CRYSTALS}
  mercury_t3: {name: T3 Меркурий, material: AMETHYST_SHARD}

