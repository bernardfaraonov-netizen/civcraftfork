# Soulbound may not go on ordinary (non-T4, non-donation) pickaxes and shovels ([CL V1.7]).
soulbound-forbidden-materials: [WOODEN_PICKAXE, STONE_PICKAXE, COPPER_PICKAXE, IRON_PICKAXE, GOLDEN_PICKAXE,
                                DIAMOND_PICKAXE, WOODEN_SHOVEL, STONE_SHOVEL, COPPER_SHOVEL, IRON_SHOVEL,
                                GOLDEN_SHOVEL, DIAMOND_SHOVEL]

# Custom enchantment effects.
effects:
  lightning: {chance: 0.07, damage: 5}
  critical: {chance: 0.15, damage: 3}
  roots: {chance: 0.15, amplifier: 4, seconds: 3.0, target-cooldown: 5.5, notify-cooldown: 15}
  punchout: {chance: 0.5}
  water-walking: {seconds: 3.0, radius: 1}
  # Resident setting that mutes root/tower notifications (/res toggle fire).
  mute-setting: 'mute-fire'
