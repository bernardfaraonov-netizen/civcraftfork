worlds:
  # Fallback when the PvE module is absent (otherwise ValleyApi.inValley / DungeonApi.inDungeon decide).
  # Air Valley: only valley (sky) gear works there, normal gear everywhere else.
  valley: [valley]
  # Dungeon: halved heavy armor speed penalty, soul armor sharpening cap +5.
  dungeon: [dungeon]

# Name colors by rarity; the default rarity of an item is picked by its tier.
rarity-colors:
  common: '<white>'
  uncommon: '<green>'
  rare: '<aqua>'
  epic: '<light_purple>'
  legendary: '<gold>'
  special: '<yellow>'
  artifact: '<#ff7f50>'
tier-rarity: {0: common, 1: uncommon, 2: rare, 3: epic, 4: legendary}

# Custom combat (spec 04 §5). Damage in HP.
combat:
  enabled: true
  # [допущение] 1.9+ attack cooldown disabled to reproduce 1.8 PvP (attack speed 1024).
  disable-attack-cooldown: true
  crit-multiplier: 1.5
  # [допущение] vanilla 1.8 armor: 4% per armor point, at most 80%, no toughness.
  armor-per-point: 0.04
  armor-max-reduction: 0.8
  # Legacy rule: gear used without the civ tech deals half damage (min 0.5).
  no-tech-multiplier: 0.5
  min-damage: 0.5
  # Damage of a weapon that does not work in the current world (valley gear outside the valley and vice versa).
  wrong-realm-damage: 1.0
  sweep-damage: 1.0
  # Damage of vanilla melee items (stone sword T0 = 10, [CL V0.2]); tools barely hurt.
  vanilla-weapons:
    WOODEN_SWORD: 6
    STONE_SWORD: 10
    GOLDEN_SWORD: 8
    COPPER_SWORD: 10
    IRON_SWORD: 10
    DIAMOND_SWORD: 10
    NETHERITE_SWORD: 10
    WOODEN_AXE: 2
    STONE_AXE: 2
    COPPER_AXE: 2
    GOLDEN_AXE: 2
    IRON_AXE: 2
    DIAMOND_AXE: 2
    NETHERITE_AXE: 2
    MACE: 6
    TRIDENT: 8
  # Arrow damage at full draw from vanilla bows (loot); custom bows use their own damage.
  vanilla-bows:
    BOW: 9
    CROSSBOW: 9
  tool-damage: 2
  sword-sharpen-cap-without-set: 3
  soul-sharpen-cap: 6
  soul-sharpen-cap-dungeon: 5
  soul-damage-threshold: 3.5
  soul-damage-multiplier: 0.5
  soul-halving-requires-full-set: true
  # Civ stats (StatService) folded into the formula: Технология будущего (+1 weapon damage, not in the
  # valley, not with soul armor) and flat player damage from talents / ultra buffs / trade goods (the
  # talent module also puts it on the attack attribute, which the formula replaces for weapons).
  weapon-damage-stat: weapon_damage
  player-damage-stat: player_damage

armor:
  dungeon-heavy-speed-factor: 0.5
  soul:
    full-set-health: 2.0
    regeneration: true
  # «Turtle shell» ruin recipe (applied by the PvE module, PDC civcraft:recipe = turtle_shell): +armor per piece.
  turtle-armor: 0.15
  # Civ stat: extra armor points on every CivCraft armor piece (Технология будущего +0.25, lighthouse...);
  # not in the valley and not on soul armor.
  armor-per-piece-stat: armor_per_piece

# Sharpening / catalysts (spec 04 §6).
sharpening:
  max-attack-level: 8
  max-defense-level: 5
  attack-per-level: 1.0
  defense-health-per-level: 1.0
  defense-health-cap-per-piece: 5.0
  base-chance:
    attack: 40
    defense: 50
  step-size: 3
  step-penalty: 21.428
  # "1 in a million" when the formula goes to zero or below.
  min-chance: 0.000001
  personal:
    per-tier: 0.1875
    max: 10
  # Price of one attempt in coins; charged by the building (Blacksmith / War Lab).
  cost: 50000
  # Levels above +2 work only if the civ researched the tech that unlocks the War Lab.
  high-level-tech: future
  unlocked-cap: 2
  stations:
    blacksmith:
      tiers: [1, 2, 3]
      t4-attack-max-level: 2
    war_lab:
      tiers: [4]
  # «Укреплённая амуниция» (Титаниум, Шёлк): uniform random bonus in percentage points, when the
  # goods module reports the resource for the player (ItemModule.sharpening().setTitaniumCheck).
  titanium:
    min: 1
    max: 5

durability:
  # [допущение] CivCraft gear does not drop; each death takes this share of max durability.
  death-loss: 0.25
  default-max: {1: 400, 2: 600, 3: 800, 4: 1000}
  # Chance that equipment keeps durability on death when the artifact is carried. Used only without the
  # artifact module (it answers ArtifactApi.deathDurabilitySaveChance); the tool-wear chance of the same
  # artifact is applied by the artifact module.
  artifact-save-chance:
    reinforced_tools: 0.15

# Repair price (spec 04 §8.1): 2500^(tier^0.2) for armor and weapons.
repair:
  base: 2500
  exponent: 0.2
  tools:
    STONE_PICKAXE: 125
    GOLDEN_PICKAXE: 750
    IRON_PICKAXE: 1500
    DIAMOND_PICKAXE: 4000
    GOLDEN_AXE: 300
    IRON_AXE: 600
    DIAMOND_AXE: 1000
    GOLDEN_SHOVEL: 150
    IRON_SHOVEL: 300
    DIAMOND_SHOVEL: 1000
    GOLDEN_HOE: 300
    IRON_HOE: 600
    DIAMOND_HOE: 1000

soulbound:
  # SoulBound keeps items on death. These switches additionally forbid dropping / storing them.
  block-drop: false
  block-containers: false

vanilla:
  # Vanilla weapon/armor crafting is disabled except the stone sword, leather armor and tools (spec 04 §4.1).
  removed-recipes:
    - iron_sword
    - golden_sword
    - diamond_sword
    - copper_sword
    - netherite_sword_smithing
    - iron_helmet
    - iron_chestplate
    - iron_leggings
    - iron_boots
    - golden_helmet
    - golden_chestplate
    - golden_leggings
    - golden_boots
    - diamond_helmet
    - diamond_chestplate
    - diamond_leggings
    - diamond_boots
    - copper_helmet
    - copper_chestplate
    - copper_leggings
    - copper_boots
    - netherite_helmet_smithing
    - netherite_chestplate_smithing
    - netherite_leggings_smithing
    - netherite_boots_smithing
    - bow
    - crossbow
    - shield
    - mace
    - copper_spear
    - iron_spear
    - golden_spear
    - diamond_spear
    - netherite_spear_smithing
    # Replaced by CivCraft recipes / donation items.
    - hopper
    - tnt
    - ender_chest
    - enchanting_table
    - golden_apple
    - saddle
  # Containers in which custom items would be consumed as vanilla ones.
  blocked-stations: [ANVIL, GRINDSTONE, SMITHING, STONECUTTER, LOOM, CARTOGRAPHY, ENCHANTING, BREWING,
                     FURNACE, BLAST_FURNACE, SMOKER, BEACON, MERCHANT, CRAFTER]
  # Blocks that eat the held item on right-click.
  blocked-blocks: [COMPOSTER, JUKEBOX, LECTERN, CHISELED_BOOKSHELF, DECORATED_POT, FLOWER_POT, CAULDRON,
                   WATER_CAULDRON, CAMPFIRE, SOUL_CAMPFIRE, BEEHIVE, BEE_NEST, RESPAWN_ANCHOR, VAULT, TRIAL_SPAWNER,
                   SPAWNER, END_PORTAL_FRAME, CRAFTER]

# Enchantments (spec 04 §7). source: library | wonder | scroll | loot.
# targets: sword, bow, pickaxe, shovel, axe, hoe, tool, fishing_rod, helmet, chestplate, leggings, boots,
#          armor, heavy_boots, weapon, any.
enchantments:
  # --- Library (§7.1): library level, price to list / hammers to list, price to apply.
  looting_1: {vanilla: 'minecraft:looting', level: 1, targets: [sword], source: library, library: {level: 1, set-price: 125, set-hammers: 12, apply-price: 50}}
  efficiency_1: {vanilla: 'minecraft:efficiency', level: 1, targets: [tool], source: library, library: {level: 1, set-price: 75, set-hammers: 75, apply-price: 15}}
  looting_2: {vanilla: 'minecraft:looting', level: 2, targets: [sword], source: library, library: {level: 2, set-price: 375, set-hammers: 37, apply-price: 250}}
  efficiency_2: {vanilla: 'minecraft:efficiency', level: 2, targets: [tool], source: library, library: {level: 2, set-price: 500, set-hammers: 50, apply-price: 74}}
  soulbound: {custom: soulbound, level: 1, targets: [tool], source: library, library: {level: 2, set-price: 25000, set-hammers: 250, apply-price: 60000}}
  fortune_1: {vanilla: 'minecraft:fortune', level: 1, targets: [pickaxe, shovel, axe, hoe], source: library, library: {level: 2, set-price: 1500, set-hammers: 150, apply-price: 750}}
  silk_touch_1: {vanilla: 'minecraft:silk_touch', level: 1, targets: [tool], source: library, library: {level: 2, set-price: 2500, set-hammers: 250, apply-price: 1000}}
  efficiency_3: {vanilla: 'minecraft:efficiency', level: 3, targets: [tool], source: library, library: {level: 3, set-price: 870, set-hammers: 87, apply-price: 200}}
  efficiency_4: {vanilla: 'minecraft:efficiency', level: 4, targets: [tool], source: library, library: {level: 3, set-price: 2500, set-hammers: 250, apply-price: 750}}
  lure_1: {vanilla: 'minecraft:lure', level: 1, targets: [fishing_rod], source: library, library: {level: 3, set-price: 4500, set-hammers: 450, apply-price: 900}}
  efficiency_5: {vanilla: 'minecraft:efficiency', level: 5, targets: [tool], source: library, library: {level: 4, set-price: 3750, set-hammers: 375, apply-price: 1500}}
  feather_falling_1: {vanilla: 'minecraft:feather_falling', level: 1, targets: [boots], source: library, library: {level: 4, set-price: 2500, set-hammers: 250, apply-price: 5000}}
  # --- Wonders (§7.2): wonder id and price.
  fire_aspect_2: {vanilla: 'minecraft:fire_aspect', level: 2, targets: [sword], source: wonder, wonder: {id: the_great_library, price: 25000}}
  fire_protection_3: {vanilla: 'minecraft:fire_protection', level: 3, targets: [armor], source: wonder, wonder: {id: the_great_library, price: 25000}}
