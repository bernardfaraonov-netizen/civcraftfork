  feather_falling_4: {vanilla: 'minecraft:feather_falling', level: 4, targets: [boots], source: wonder, over-others: true, wonder: {id: world_university, price: 35000}}
  respiration_3: {vanilla: 'minecraft:respiration', level: 3, targets: [helmet], source: wonder, wonder: {id: world_university, price: 25000}}
  infinity_1: {vanilla: 'minecraft:infinity', level: 1, targets: [bow], source: wonder, wonder: {id: neuschwanstein, price: 100000}}
