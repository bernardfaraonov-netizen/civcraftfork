# Item module rules (spec 04 §4–§8, spec 01 §4.1/§5.1/§19, spec 03 §8–§10).
# Item and recipe definitions live in the files listed under `files`; other modules may add their own
# files through ItemModule.defineItems()/defineRecipes().

files: [items_materials, items_gear, items_special]

# Symbolic tech names used by `tech:` keys in item/recipe files → tech ids of the science module.
# Only this table has to change if the science module names its technologies differently.
techs:
  archery: archery                         # Стрельба
  blacksmithing: blacksmithing             # Кузница
  metal_casting: metal_casting             # Литьё металлов
  fletching: fletching                     # Оперение стрел
  leather_refinement: leather_refinement   # Выделка кожи
  metallurgy: metallurgy                   # Металлургия
  sword_smithing: sword_smithing           # Ковка мечей
  composite_bow: composite_bow             # Составной лук
  tanning: tanning                         # Дубление
  chemistry: chemistry                     # Химия
  damascus_steel: damascus_steel           # Булатная сталь
  laminates: lamination                    # Ламинация
  composites: composite_chemistry          # Химия композитов
  alloying: alloying                       # Легирование
  metal_alloys: metal_alloys               # Сплавы металлов
  military_science: military_science       # Военная наука
  future: future_tech                      # Технология будущего (открывает Военную лабораторию)
  engineering: engineering                 # Инженерия (Воронка)
  ballistics: ballistics                   # Баллистика (крафт TNT)
  electricity: electricity                 # Электричество (Электроника) [допущение]
  assembly_line: assembly_line             # Конвейерная сборка (Завод)

