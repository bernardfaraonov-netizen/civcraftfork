# World wonders and national wonders (docs/spec/03_wonders_science.md §4–§6, 02_buildings.md §10).
# Same schema as structures.yml. General wonder rules (uniqueness, 2 per town, town age, race refund, architects'
# experience) are configured in structures.yml → construction / validation.
#   regen        hit points regenerated per second outside of war (war-regen: false = also not during war)
#   wonder-slot  counts against the per-town wonder limit (national wonders do not)
#   requires     {type, scope: all_towns | native_towns, level} – national wonders need the building in every town
#   requires-active  the requirement must keep holding for the effects to work (national wonders)
#   required-item    custom item consumed when construction starts (space shuttle)

