# Structures (docs/spec/02_buildings.md §1, §2, §5, §6, §7; docs/spec/01_core.md §5.5, §6.2).
# Money in coins, upkeep per day, hammers total, hp = war hit points, score = civ score points.
# World and national wonders live in wonders.yml (same schema).
#
# Type fields:
#   name / aliases       Russian display name and extra names for /build (partial names match too)
#   category             building | improvement | wonder | national_wonder | main | wall | road | defense | ship | special
#   era                  era index 0..7 (spec 03 §2)
#   tech                 required technology ids (all of them)
#   requires             required structures: [type] (in this town) or [{type: x, scope: all_towns|native_towns|town, level: n}]
#   nation / replaces    nation-exclusive building and the base type it replaces for that nation
#   counts-as            satisfies requirements / limits of another type (dojo counts as barracks)
#   size                 footprint in chunks [width (template X), depth (template Z)]
#   cost/upkeep/hammers/hp/score
#   limit / civ-limit    per town / per civilization, 0 = unlimited (stat "limit.<id>" adds to it)
#   slot                 uses an improvement slot of the town
#   claim                culture (inside town culture) | claimed (all chunks claimed by the town) | auto (claimed automatically, locked)
#   water                none | water | ocean | river_or_ocean (chunk aligned at sea level)
#   min-y / max-y        allowed base height (absolute), in addition to the world limits
#   spacing              [group, blocks]: XZ distance to structures of the same group of the civ (stat "spacing.<group>" adds)
#   template / y-shift   template file id (templates/<theme>/<template>.schem) and vertical offset
#   style                procedural template style when no .schem exists: hall | workshop | temple | tower | spire | ship | field | industrial | lighthouse | wonder | monument | market
#   markers              functional markers the procedural template must contain (chest 1, sign x, control, ...)
#   tags                 cost/upkeep modifier groups: stats build_cost.<tag>, build_hammers.<tag>, upkeep.<tag>
#   levels               upgrade levels {n: {cost, hammers, tech}}; max-level for levels earned by production
#   lose-level-on-destroy  loses one level when destroyed in war
#   infrastructure       infrastructure bonus targets (cottage / mine) – spec §1.8
#   effects              static modifiers while complete and not destroyed (EffectParser format)
#   floating             no ground support check (airship)
#   capital-only / culture-level / war-only / required-item / resource-point  extra placement rules
#
# Technology ids are those of balance/techs.yml (science module, spec 03 §3):
#   C1 arsenal, archery, blacksmithing, metal_casting, fletching, leather_refinement, metallurgy, sword_smithing,
#      composite_bow, tanning, chemistry, damascus_steel, lamination, composite_chemistry, alloying, metal_alloys,
#      military_science, future_tech
#   C2 mining, productivity, construction, sailing, architecture, taxation, artillery, navigation, efficiency, ballistics,
#      engineering, alchemy, assembly_line, scientific_method, electricity, innovation, fertilizer, radio,
#      electrodynamics, biology, plastics, cryogenics
#   C3 agriculture, pottery, hunting, machinery (Механизмы), beekeeping, trade, driven_hunt (Загонная охота), commerce,
#      education, global_trade, monopoly, mechanical_engineering (Машиностроение), republic
#   C4 religion, monarchy, winemaking, legislation, church, writing, fermentation, currency, brewing, economics,
#      nationalism, archaeology, fine_arts
#   C5 wonder techs: wonder_<wonder>, e.g. wonder_parthenon, wonder_great_pyramid, wonder_council_of_eight

construction:
  # Build speed = speed-multiplier × town hammers/h (spec §1.4); defaults to core.yml hammers.build-speed-multiplier.
  speed-multiplier: 2.0
  # Hammers/h used when no town module provides production figures.
  fallback-hammers: 100
  # true: an ordinary building pauses a wonder under construction (spec 02 §1.4 assumption);
  # false: both progress at full speed (spec 01 §12).
  pause-wonder-while-building: false
  # Blocks placed per server tick across all constructions / restorations.
  blocks-per-tick: 300
  # Progress message every N percent (wonders are announced to everyone).
  announce-step: 5
  # Share of the paid cost returned by /build cancel.
  cancel-refund: 0.5
  # Share of the cost returned to a town that lost a wonder race (spec 03 §4.2).
  wonder-race-refund: 0.5
  # Architects' experience: hammers × (1 − per-2-percent × floor(progress%/2)), at most max.
  architects-per-2-percent: 0.01
  architects-max: 0.5
  # Include structures still under construction in the daily upkeep.
  upkeep-under-construction: false
  # Seconds between database saves of construction progress.
  save-interval-seconds: 15

validation:
  ground-solid-ratio: 0.8
  # spec 02 §1.3: build.minY = 9, build.maxY = world height − template height.
  min-y: 9
  # Water structures: the player must be within this many blocks of sea level; share of the footprint that must be water.
  water-y-tolerance: 10
  water-min-ratio: 0.5
  # Maximum distance (blocks) between the command position and the confirmation.
  confirm-radius: 12
  # Seconds the placement preview / confirmation stays valid.
  confirm-seconds: 90
  # Minimum XZ distance from a town hall / capitol to the main building of another town.
  main-building-distance: 150
  # A town must be this old to start a world wonder (spec 03 §4.4).
  wonder-min-age-days: 3
  # World wonders per town (national wonders and types with wonder-slot: false do not count).
  wonders-per-town: 2
  # Worlds in which wonders may be built (empty = every CivCraft world).
  wonder-worlds: []

repair:
  # spec 02 §1.6: 50% of the price and hammers / 3; speed = town hammers/h / number of parallel repairs.
  cost-share: 0.5
  hammers-divisor: 3
refresh:
  cooldown-minutes: 10

destroy:
  # What a destroyed structure turns into (spec 02 §1.6: "загорается, превращается в булыжник").
  rubble-block: cobblestone
  rubble-share: 0.6
  fire-blocks: 16

control:
  block: obsidian
  base-block: chiseled_stone_bricks
  destroyed-block: cobblestone
  hologram-height: 1.6

progress:
  bossbar-radius: 96
  hologram: true

preview:
  enabled: true
  valid-block: lime_stained_glass
  invalid-block: red_stained_glass
  beam-height: 40
  edge-thickness: 0.08

# Structure blocks: who may use containers and doors inside structures (town | civ | all). War rules override this.
interact:
  containers: town
  doors: all
  other: all

themes:
  default: {name: Стандартный}
  arctic: {name: Арктический}
  aztec: {name: Ацтекский}
  egyptian: {name: Египетский}
  hell: {name: Адский}
  roman: {name: Римский}

# Nation ids as used by Civilization.nation(); aliases make the check independent of the naming used by the civ module.
