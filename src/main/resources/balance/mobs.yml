      - {item: mat_leather_straps, chance: 10}
      - {item: mat_sticky_resin, chance: 10}
      - {item: mat_smithy_resin, chance: 1}
      - {item: mat_mercury, chance: 2}
      - {item: mat_mercury_bath, chance: 0.8}
  ruffian:
    lesser:
      - {item: mat_ionic_crystal_fragment_1, chance: 5}
      - {item: mat_forged_clay, chance: 10}
      - {item: mat_crafted_reeds, chance: 10}
      - {item: mat_crafted_sticks, chance: 10}
      - {item: leather, chance: 40}
      - {item: mat_refined_sulphur, chance: 15}
    greater:
      - {item: mat_ionic_crystal_fragment_2, chance: 5}
      - {item: mat_carved_leather, chance: 10}
      - {item: mat_crafted_string, chance: 3}
      - {item: mat_refined_slime, chance: 5}
      - {item: mat_varnish, chance: 1}
      - {item: mat_sticky_resin, chance: 1}
      - {item: mat_refined_sulphur, chance: 25}
    elite:
      - {item: mat_ionic_crystal_fragment_3, chance: 5}
      - {item: mat_leather_straps, chance: 10}
      - {item: mat_crafted_string, chance: 5}
      - {item: mat_refined_slime, chance: 5}
      - {item: mat_varnish, chance: 1}
      - {item: mat_sticky_resin, chance: 1}
