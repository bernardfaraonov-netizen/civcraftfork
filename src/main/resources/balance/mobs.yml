# Custom mobs (spec 04 §10, dungeon rats §12). Mobs are vanilla entities tagged in their PDC; stats are
# applied with attributes. All values marked [assumption] are not in the sources and can be tuned.

# Vanilla entity used for every mob type [assumption, spec 04 §10.1].
entity-types:
  yobo: zombie
  angry_yobo: zombie        # spawned as a baby zombie
  savage: husk              # "cannibal", melee
  ruffian: witch            # throws potions
  behemoth: iron_golem      # passive until hit
  rat: silverfish           # dungeon rat (cannot hide in blocks)

# hp / damage in HP units (2 HP = 1 heart); speed = multiplier of the vanilla movement speed;
# armor = armour points; defence = flat reduction of every incoming hit; coins = [min, max] whole coins.
# Coins are the final V1.10.5 values (spec 04 §10.5); Savage/Ruffian/Behemoth coins are [assumption].
mobs:
  yobo:
    defaults: {follow-range: 32, xp: 5}
    lesser:  {hp: 40,  damage: 4,  speed: 1.0,  coins: [10, 50]}
    greater: {hp: 80,  damage: 6,  speed: 1.05, coins: [75, 150]}
    elite:   {hp: 140, damage: 9,  speed: 1.1,  coins: [150, 262]}
    brutal:  {hp: 220, damage: 12, speed: 1.15, coins: [225, 300]}
  angry_yobo:
    # [assumption] half the HP and ~60 % of the damage of the big Yobo of the same tier.
    defaults: {follow-range: 32, xp: 2}
    lesser:  {hp: 20,  damage: 3, speed: 1.0,  coins: [5, 20]}
    greater: {hp: 40,  damage: 4, speed: 1.05, coins: [45, 60]}
    elite:   {hp: 70,  damage: 6, speed: 1.1,  coins: [75, 90]}
    brutal:  {hp: 110, damage: 8, speed: 1.15, coins: [105, 120]}
  savage:
    defaults: {follow-range: 32, xp: 5}
    lesser:  {hp: 40,  damage: 4,  speed: 1.0,  coins: [10, 40]}
    greater: {hp: 80,  damage: 6,  speed: 1.05, coins: [30, 60]}
    elite:   {hp: 140, damage: 9,  speed: 1.1,  coins: [60, 120]}
    brutal:  {hp: 220, damage: 12, speed: 1.15, coins: [90, 150]}
  ruffian:
    # Witches drop their potions, which can be drunk (CL V1.9.2).
    defaults: {follow-range: 24, xp: 5, keep-vanilla-drops: [POTION, SPLASH_POTION]}
    lesser:  {hp: 40,  damage: 4,  speed: 1.0,  coins: [10, 40]}
    greater: {hp: 80,  damage: 6,  speed: 1.05, coins: [30, 60]}
    elite:   {hp: 140, damage: 9,  speed: 1.1,  coins: [60, 120]}
    brutal:  {hp: 220, damage: 12, speed: 1.15, coins: [90, 150]}
  behemoth:
    defaults: {follow-range: 24, xp: 8, knockback-resistance: 0.6}
    lesser:  {hp: 40,  damage: 4,  speed: 1.0,  coins: [10, 40]}
    greater: {hp: 80,  damage: 6,  speed: 1.05, coins: [30, 60]}
    elite:   {hp: 140, damage: 9,  speed: 1.1,  coins: [60, 120]}
    brutal:  {hp: 220, damage: 12, speed: 1.15, coins: [90, 150]}
  rat:
    # Spec 04 §12 (CL V1.4.1): 45 HP, 8 damage ignoring armour, every hit reduced by 20.
    lesser: {hp: 45, damage: 8, speed: 1.1, defence: 20, ignore-armor: true, scale: 1.6, follow-range: 20,
             coins: [150, 250], xp: 5}

# Vanilla drop of every mob (spec 04 §10.4). Looting adds to these amounts only.
common-drops:
  - {item: bone, chance: 10}
  - {item: sugar, chance: 10}
  - {item: gunpowder, chance: 25}
  - {item: potato, chance: 10}
  - {item: carrot, chance: 10}
  - {item: coal, chance: 10}
  - {item: string, chance: 10}
  - {item: slime_ball, chance: 2}

# Extra drop of every Lesser mob (CL V1.6.5).
lesser-drops:
  - {item: wheat, chance: 2.5}

# Custom drops (spec 04 §10.4). Ids are item-module ids. "no-angry: true" = not dropped by Angry Yobo.
# "mercury: true" entries are scaled by the "Fat rats" world event. Mercury values already include V1.10.6.
