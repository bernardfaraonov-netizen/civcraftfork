  rat:
    # Spec 04 §12: page values T1 4.5 %, T2 2 %, ×1.25 (CL V1.10.7) [assumption]. No T3 since CL V1.5.
    lesser:
      - {item: mat_mercury, chance: 5.625, mercury: true}
