# 1.8 wiki biomes mapped to 1.21 (spec 04 §10.3). A biome may list several mobs: all of them spawn there
# (merged old biomes). Format: "<type>:<tier>".
biomes:
  plains: [yobo:lesser]
  forest: [yobo:lesser]
  birch_forest: [yobo:lesser]
  sunflower_plains: [yobo:greater]
  flower_forest: [yobo:greater]
  old_growth_birch_forest: [yobo:greater, ruffian:elite]
  windswept_hills: [yobo:elite]
  windswept_forest: [yobo:elite]
  dark_forest: [yobo:elite, ruffian:elite]
  old_growth_spruce_taiga: [yobo:brutal, ruffian:greater]
  windswept_gravelly_hills: [yobo:brutal]
  desert: [savage:lesser]
  savanna: [savage:greater]
  savanna_plateau: [savage:greater]
  windswept_savanna: [savage:greater]
  badlands: [savage:elite]
  wooded_badlands: [savage:elite]
  old_growth_pine_taiga: [savage:elite, ruffian:lesser]
  eroded_badlands: [savage:brutal]
  jungle: [ruffian:lesser]
  sparse_jungle: [ruffian:lesser]
  swamp: [ruffian:lesser]
  bamboo_jungle: [ruffian:greater]
  mangrove_swamp: [ruffian:brutal]
  frozen_river: [behemoth:lesser]
  snowy_taiga: [behemoth:greater]
  snowy_slopes: [behemoth:greater]
  snowy_plains: [behemoth:elite]
  ice_spikes: [behemoth:brutal]

# A weapon may only hurt mobs whose tier is at most weapon tier + 1 (spec 04 §5.1). The item module
# writes the tier in the item PDC (civcraft:tier); plain vanilla items use this table.
weapon-tiers:
  enabled: true
  default: 0
  materials:
    wooden_sword: 0
    stone_sword: 0
    golden_sword: 0
    iron_sword: 1
    diamond_sword: 2
    netherite_sword: 3
    wooden_axe: 0
    stone_axe: 0
    golden_axe: 0
    iron_axe: 1
    diamond_axe: 2
    netherite_axe: 3
    bow: 1
    crossbow: 1
    trident: 2
    mace: 2

rules:
  # Custom drops, coins and XP only when a player landed the kill (anti-farm).
  require-player-kill: true
  # A hit reduced by "defence" (rats) still deals at least this much [assumption].
  min-damage-after-defence: 1.0
  # Damage causes custom mobs ignore (legacy behaviour; explosions would bypass the weapon tier rule).
  immune-damage: [SUFFOCATION, CONTACT, FALL, FIRE, FIRE_TICK, LAVA, DROWNING, HOT_FLOOR, CRAMMING,
                  FREEZE, BLOCK_EXPLOSION, ENTITY_EXPLOSION, LIGHTNING, CAMPFIRE]
  no-sun-burn: true

abilities:
  yobo:
    angry-count: 6               # Angry Yobo per wave
    wave-cooldown-seconds: 30
    max-waves: 2                 # CL V0.9
    angry-idle-despawn-seconds: 10
  savage:
    slow-chance: 25              # percent per hit
    slow-level: 2                # Slowness II
    slow-seconds: [3, 3.5, 4, 5] # T1..T4
  ruffian:
    potion-bonus-per-tier: 0.125 # +12.5 % potion strength per tier
    splash-radius: 9
  behemoth:
    interval-seconds: [6, 5.5, 5, 4.5]
    radius: 5.75
    strong-chance: 30
    strong-multiplier: 1.5       # [assumption] damage and knockback of a strong slam
    knockback: 1.315
    aggro-seconds: 30            # [assumption] how long it stays angry after being hit

spawn:
  enabled: true
  worlds: []                     # empty = the main world from config.yml
  interval-ticks: 40
  players-per-run: 4             # round-robin: players handled per run
  radius-min: 24
  radius-max: 64
  player-radius: 64              # custom mobs counted around a player
  player-cap: 6                  # no spawns around a player that already has this many
  local-radius: 16
  local-cap: 4                   # no spawns next to this many custom mobs
  group-min: 2                   # "minimum mobs per spawn ×2" (CL V0.9)
  group-max: 3
  attempts: 5
  safe-radius-from-world-spawn: 150
  camp-radius: 24                # no mobs this close to a camp
  natural:
    replace-chance: 0.5          # share of natural monster spawns in mapped biomes replaced by custom mobs
    cancel-unreplaced: false     # also cancel the other natural monster spawns there

clearlag:
  enabled: true
  interval-minutes: 20           # CL V0.9.5
  warnings-seconds: [60, 30, 10, 5]
  remove-items: true
  remove-vanilla-monsters: true
