# Победа (docs/spec/03_wonders_science.md §11).
# Условия проверяются каждый день на сборе налогов (config.yml → daily-tick-hour). Запуск любой победы —
# не раньше start-after-days после начала фазы. Если условие нарушено, отсчёт прерывается и обнуляется.
# Города «Купленный» в победах не учитываются, чудеса считаются только в незахваченных и некупленных городах.

# Начало фазы (ISO-дата, например 2026-09-01). Пусто — момент первого запуска плагина.
phase-start: ''
phase-name: ''
server-name: Alcor
start-after-days: 21

# Удержание (дней) по типам победы.
hold-days:
  religious: 21
  economic: 21
  diplomatic: 21
  cultural: 21
  scientific: 21
  domination: 14

religious:
  min-points: 45000
  wonder: notre_dame
economic:
  wonder: world_bank
  min-level: 5
diplomatic:
  wonder: council_of_eight
cultural:
  wonder: burj_al_arab
  # Сумма накопленной культуры родных городов.
  min-culture: 13000000
scientific:
  wonder: space_shuttle
  # Нужна последняя (7-я) миссия; наука в час: родные города 100 %, остальные non-native-weight.
  min-beakers: 20000
  non-native-weight: 0.3
domination:
  score-ratio: 9
  min-wonders: 6
  # Не входят в число чудес (национальные не считаются всегда) [CL 0.8].
  excluded-wonders: [space_shuttle]

# Награда: префикс [WON] основателю (каждый раз другого цвета), запись в «Зал победителей».
# Команды консоли для внешних наград (например, 1 500 вимеров): {player} {civ} {type}.
reward-commands: []
won-colors: [gold, aqua, light_purple, green, red, yellow, blue, dark_aqua, dark_purple, dark_green]

bossbar:
  enabled: true
  color: YELLOW
  overlay: PROGRESS

# Очки цивилизации для доминационной победы: сумма очков городов + технологий.
score:
  town-chunk: 200
  culture-chunk: 100
  resident: 5000
  # Монет казны города за 1 очко.
  coins-per-point: 5
  # Очков за пробирку базовой стоимости изученной технологии.
  tech-per-beaker: 0.25
  # Очки построек (docs/spec/02_buildings.md §2, чудеса — spec 03 §5–6). Ключи — id типов построек
  # или ключи чудес из science.yml.
  structures:
    capitol: 6000
