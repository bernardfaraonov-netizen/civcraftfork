# Дерево технологий CivCraft V1.10.9 (docs/spec/03_wonders_science.md §1–3).
# Монеты — в монетах, пробирки — в пробирках. Эры 0..7.
#
# unlocks — что открывает технология. Другие модули проверяют доступ через
# ResearchApi.hasTech(civ, id) или ResearchApi.unlocked(civ, <категория>, <id>).
# Категории: structures, upgrades, governments, items, units, artifacts, missions, wonders.
# effects — модификаторы статов (EffectParser-формат), действуют на всю цивилизацию.

# Формула стоимости (§1.2):
#   монеты   = база × (1 + (эра_тех + эра_цив/10) × era-weight + (города − 1) × city-coins)
#   пробирки = база × (1 + (эра_тех + эра_цив/10) × era-weight + (города − 1) × city-beakers)
# Скидки складываются и применяются одним множителем, не больше max-discount.
cost:
  era-weight: 0.11
  civ-era-divisor: 10
  city-coins: 0.05
  city-beakers: 0.075
  max-discount: 0.75
  # Отставание от лидера по эре: при отставании >= start эр скидка per-era за каждую эру сверх первой.
  era-lag:
    start: 2
    per-era: 0.10

eras:
  0: {name: Первобытная эра, color: white}
  1: {name: Каменный век, color: yellow}
  2: {name: Средневековье, color: light_purple}
  3: {name: Эра Ренессанса, color: green}
  4: {name: Паровой век, color: gold}
  5: {name: Индустриальная эра, color: dark_green}
  6: {name: Атомная эра, color: aqua}
  7: {name: Информационная эра, color: dark_purple}

branches:
  military: {name: Вооружение, icon: IRON_SWORD, military: true}
  progress: {name: Технический прогресс, icon: PISTON}
  economy: {name: Экономика, icon: EMERALD}
  society: {name: Общество, icon: WRITABLE_BOOK}
  wonders: {name: Чудеса света, icon: NETHER_STAR}

