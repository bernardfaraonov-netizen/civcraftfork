# Дипломатия (docs/spec/01_core.md §17). Расписание войны — config.yml war.schedule.

# Максимальная длительность отношения, затем NEUTRAL [CL 1.6].
lifetime-days:
  peace: 7
  ally: 14
  hostile: 14
  war: 21

# Время ответа на запрос мира/союза/нейтралитета и подарки.
request-seconds: 300

# Войну нельзя объявить менее чем за 72 ч до войны (24 ч при запущенной победе).
declare-war-hours-before: 72
declare-war-hours-before-victory: 24

# Союзники не объявляют друг другу войну за 24 ч до войны (кроме запущенной победы).
ally-declare-hours-before: 24

# Союз нельзя заключить за N дней до войны, если одна из сторон воюет.
ally-lock-days-before-war: 3

# Подарки городов и цивилизаций: не за 3 дня до войны (1 день при запущенной победе).
gift-lock-days: 3
gift-lock-days-victory: 1

# Цивилизация может объявить войну провинции старше 7 дней, если сама не младше 7 дней (§5.3).
province-war-exception-days: 7

# Захваченный город капитулирует автоматически через 7 дней.
auto-capitulate-days: 7

# Во время войны дипломатические запросы не принимаются.
no-diplomacy-during-war: true

# PvP в приватах городов невоюющих цивилизаций выключено (изгнанников можно бить).
town-pvp-protection: true
