recipes:
  # ---------------------------------------------------------------- camp / civ (spec 01 §4.1, §5.1)
  chieftain_headdress: {shapeless: [packed_feathers x2, carved_leather x2]}
  camp_door: {shape: [' h ', 'lll', 'ccc'], keys: {h: chieftain_headdress, l: milled_lumber, c: 'minecraft:coal_block'}}
  leadership_badge: {shapeless: [leadership_token x6]}
  leadership_proof: {shapeless: [leadership_badge x4]}
  royal_crown: {shapeless: [leadership_proof, jewelry_gold x3, decorative_jewels x2]}
  founding_flag: {shape: ['srs', 'sss', 'mmm'], keys: {s: compacted_stone, r: royal_crown, m: mortar}}
  # ---------------------------------------------------------------- war (spec 04 §4.4)
  warship: {shapeless: [lumber_t4 x3, carbide_mold, '#white_wool x4', feathered_lining]}         # [CL V1.3]
  war_camp: {shapeless: [lumber_t4 x3, leather_straps x2, '#white_wool x4']}                    # [допущение]
  cannon: {shapeless: [lumber_t4 x2, steel_ingot x3, steel_cast]}                             # [допущение]
  # ---------------------------------------------------------------- misc
  rename_tag: {shapeless: ['minecraft:paper', crafted_string, 'minecraft:gold_ingot']}         # [допущение]
  beehive_frame: {shape: ['lll', 'lwl', 'lll'], keys: {l: '#leaves', w: refined_wood}}          # [CL V1.8]
  saddle: {result: 'minecraft:saddle', category: special, shapeless: [carved_leather x2, woven_threading x2]}  # [CL V1.4]
  hopper: {result: 'minecraft:hopper', category: special, tech: engineering, shape: ['kck', 'kkk'], keys: {k: carbide_ingot, c: 'minecraft:chest'}}  # [CL V1.4]
  tnt: {result: 'minecraft:tnt', category: special, tech: ballistics, shape: ['gsg', 'sgs', 'gsg'], keys: {g: 'minecraft:gunpowder', s: '#sand'}}
  # ---------------------------------------------------------------- Factory (spec 03 §9.3): the Factory takes everything from its
  # chests; these recipes are not crafted on a workbench.
  space_shuttle: {station: factory, tech: assembly_line, ingredients: [carbide_plate x25, hard_rubber x20, mortar x50, reinforced_fiber x25, industrial_diamond x5, electronics x20]}
  space_satellite: {station: factory, ingredients: [electronics x20, steel_plate x4]}
  space_fuel_tanks: {station: factory, ingredients: [steel_plate x10, 'minecraft:magma_cream x250']}
  space_engines: {station: factory, ingredients: [electronics x10, tungsten_plate x4]}
  space_lander: {station: factory, ingredients: [leather_straps x8, reinforced_fiber x5, hard_rubber x8, compacted_stone x8, electronics x16]}
  space_orbital_station: {station: factory, ingredients: [electronics x50, tungsten_plate x4, mortar x20, hard_rubber x16, reinforced_fiber x8, 'minecraft:cooked_porkchop x256', 'minecraft:carrot x512']}
  space_habitat_module: {station: factory, ingredients: [electronics x24, tungsten_plate x8, mortar x10, hard_rubber x16, reinforced_fiber x8, 'minecraft:cooked_porkchop x256', 'minecraft:glass_bottle x512', 'minecraft:water_bucket x3', 'minecraft:carrot x320', '#mushrooms x64', 'minecraft:potato x256', 'minecraft:red_mushroom x128', 'minecraft:baked_potato x64', 'minecraft:bowl x128', 'minecraft:cooked_rabbit x64']}
  space_solar_reflector: {station: factory, ingredients: [electronics x32, tungsten_plate x8, 'minecraft:gold_ingot x1024']}
  # «Датчик дневного света 646» in the wiki is most likely a typo for 64 (spec 03 §9.3).
  space_instruments: {station: factory, ingredients: [electronics x50, 'minecraft:repeater x32', 'minecraft:comparator x32', 'minecraft:daylight_detector x64']}
  space_solar_sail: {station: factory, ingredients: [reinforced_fiber x16, steel_plate x16]}
  space_provisions: {station: factory, ingredients: ['minecraft:cooked_porkchop x1024', 'minecraft:glass_bottle x2048', 'minecraft:water_bucket x15', 'minecraft:carrot x2048', '#mushrooms x512', 'minecraft:potato x2048', 'minecraft:red_mushroom x1536', 'minecraft:baked_potato x512', 'minecraft:bowl x1024', 'minecraft:cooked_rabbit x512']}
  space_warp_core: {station: factory, ingredients: [metallic_crystal_t4 x4, ionic_crystal_t4 x4, mercury_t2 x4]}
  space_warp_drive: {station: factory, ingredients: [tungsten_ingot x10, carbide_ingot x16, tungsten_plate x8]}
  space_gondolas: {station: factory, ingredients: [steel_cast x32, tungsten_ingot x18, reinforced_fiber x8, hard_rubber x16]}

groups:
  sand: [SAND, RED_SAND]
  mushrooms: [BROWN_MUSHROOM]
