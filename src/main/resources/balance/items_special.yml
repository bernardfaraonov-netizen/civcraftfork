# Special items (spec 01 §4.1/§5.1, spec 04 §3/§4.4/§15, spec 03 §5.13/§8/§9/§10).
# Right-click behaviour of these items is registered by the owning modules through ItemApi.onUse(id, ...).
# `data` is a free string map other modules read through ItemModule.def(id).data().

