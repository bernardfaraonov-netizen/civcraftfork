# "9 of tier N → 1 of tier N+1" chains (spec 04 §4.1). Each `inputs` entry becomes its own recipe, so
# different log species are never mixed in one craft. ratio 2 for slime (24 slime = 12 T1 slime).
compression:
  wood:
    ratio: 9
    inputs: ['#oak_logs', '#birch_logs', '#spruce_logs', '#jungle_logs', '#acacia_logs', '#dark_oak_logs',
             '#cherry_logs', '#mangrove_logs', '#pale_oak_logs']
    chain: [refined_wood, milled_lumber]
  stone:
    ratio: 9
    inputs: ['minecraft:cobblestone']
    chain: [refined_stone, crushed_stone, compacted_stone]
  feathers: {ratio: 9, inputs: ['minecraft:feather'], chain: [packed_feathers]}
  leather: {ratio: 9, inputs: ['minecraft:leather'], chain: [carved_leather]}
  sugar: {ratio: 9, inputs: ['minecraft:sugar'], chain: [refined_sugar]}
  reeds: {ratio: 9, inputs: ['minecraft:sugar_cane'], chain: [crafted_reeds]}
  clay: {ratio: 9, inputs: ['minecraft:clay_ball'], chain: [forged_clay]}
  sticks: {ratio: 9, inputs: ['minecraft:stick'], chain: [crafted_sticks]}
  string: {ratio: 9, inputs: ['minecraft:string'], chain: [crafted_string]}
  sulphur: {ratio: 9, inputs: ['minecraft:gunpowder'], chain: [refined_sulphur]}
  slime: {ratio: 2, inputs: ['minecraft:slime_ball'], chain: [refined_slime]}
  # [допущение] the general 9 → 1 rule for mercury (boss: «1 T3» ≈ «9 T2»).
  mercury: {ratio: 9, chain: [mercury_t1, mercury_t2, mercury_t3]}
  # [допущение] crystal of tier N = 9 fragments of tier N; fragments come only from mobs.
  metallic_t1: {ratio: 9, chain: [metallic_fragment_t1, metallic_crystal_t1]}
  metallic_t2: {ratio: 9, chain: [metallic_fragment_t2, metallic_crystal_t2]}
  metallic_t3: {ratio: 9, chain: [metallic_fragment_t3, metallic_crystal_t3]}
  metallic_t4: {ratio: 9, chain: [metallic_fragment_t4, metallic_crystal_t4]}
  ionic_t1: {ratio: 9, chain: [ionic_fragment_t1, ionic_crystal_t1]}
  ionic_t2: {ratio: 9, chain: [ionic_fragment_t2, ionic_crystal_t2]}
  ionic_t3: {ratio: 9, chain: [ionic_fragment_t3, ionic_crystal_t3]}
  ionic_t4: {ratio: 9, chain: [ionic_fragment_t4, ionic_crystal_t4]}

