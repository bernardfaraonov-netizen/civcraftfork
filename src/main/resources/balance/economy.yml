# Экономика (docs/spec/01_core.md §8–§12). Счастье, культура, содержание уровней — в core.yml.

# Операции с казной не меньше этой суммы пишутся в чат города/цивилизации (/civ set moneylog).
money-log-threshold: 5000

# Захваченные города: молоточки, наука, урожайность, религия ×0.5 [CL 1.7].
captured-multiplier: 0.5

# Последствия долга до продажи (§8.3 [допущение]): культура не растёт.
debt-stops-culture: true

# Культура Ратуши (+25) и Капитолия (+50) начисляется этим модулем (core.yml culture.town-hall/capitol).
# Модуль построек уже даёт эту культуру эффектами ратуши и Капитолия, поэтому по умолчанию выключено.
main-building-culture: false

# Мэры и ассистенты не платят flat tax и налог на имущество (как в оригинальном CivCraft).
officials-exempt-from-taxes: true

# Житель с долгом дольше N дней исключается из города (§8.4 [допущение]).
resident-debt-evict-days: 7

# Сколько чанков в секунду сканировать на биом (асинхронная загрузка).
biome-scan-per-second: 16

# Военный налог агрессора (§8.3): ×2.5; противник с эффектом enemy_war_upkeep_multiplier (Нотр-Дам) — больше.
war-upkeep:
  multiplier: 2.5
